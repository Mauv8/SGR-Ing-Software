{% extends "base.html" %}
{% block titulo %}Registrar actividad{% endblock %}
{% block contenido %}
<h1>Registrar actividad</h1>
<div class="panel">
  <p>Cargo: <strong>{{ user.cargo }}</strong> · El código se genera automáticamente al guardar.</p>
  <form method="post" novalidate>
    {% csrf_token %}
    {% include "gestion/_campos.html" %}
    <div class="botonera"><button type="submit" class="boton-primario">Guardar actividad</button>
      <a class="boton-secundario" href="{% url 'actividades' %}">Cancelar</a></div>
  </form>
</div>
{% endblock %}
