{% extends "base.html" %}
{% block titulo %}Ingresar{% endblock %}
{% block contenido %}
<div class="panel login">
  <h1>Ingresar al SGR</h1>
  {% if form.non_field_errors %}<div class="mensaje error" role="alert">{{ form.non_field_errors|join:" " }}</div>{% endif %}
  <form method="post">
    {% csrf_token %}
    <p><label for="id_username">Usuario</label>{{ form.username }}</p>
    <p><label for="id_password">Contraseña</label>{{ form.password }}</p>
    <input type="hidden" name="next" value="{{ next }}">
    <button type="submit">Ingresar</button>
  </form>
</div>
{% endblock %}
