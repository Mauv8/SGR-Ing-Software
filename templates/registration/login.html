{% extends "base.html" %}
{% block titulo %}Ingresar{% endblock %}
{% block contenido %}
<div class="panel login">
  <h1>Ingresar al SGR</h1>
  {% if form.non_field_errors %}<div class="mensaje error" role="alert">{{ form.non_field_errors|join:" " }}</div>{% endif %}
  <form method="post">
    {% csrf_token %}
    <div class="campo"><label for="id_username">Usuario</label>{{ form.username }}</div>
    <div class="campo"><label for="id_password">Contraseña</label>{{ form.password }}</div>
    <input type="hidden" name="next" value="{{ next }}">
    <div class="botonera"><button type="submit" class="boton-primario">Ingresar</button></div>
  </form>
</div>
{% endblock %}
